name: AKernel gVisor candidate

run-name: Build candidate ${{ inputs.release_tag }}

"on":
  workflow_dispatch:
    inputs:
      release_tag:
        description: Planned AKernel gVisor release tag
        required: true
        type: string

concurrency:
  group: akernel-gvisor-candidate-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    if: github.ref_name == 'develop'
    runs-on: ubuntu-24.04
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
    - name: Checkout
      uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Validate candidate
      id: candidate
      shell: bash
      run: |
        set -euo pipefail

        if [[ ! "${RELEASE_TAG}" =~ ^release-[0-9]{8}\.[0-9]+-akernel\.[1-9][0-9]*$ ]]; then
          echo "invalid release tag: ${RELEASE_TAG}" >&2
          exit 1
        fi

        upstream_tag="${RELEASE_TAG%-akernel.*}"
        git fetch --force --no-tags https://github.com/google/gvisor.git \
          "refs/tags/${upstream_tag}:refs/tags/${upstream_tag}"
        git merge-base --is-ancestor "${upstream_tag}" "${GITHUB_SHA}"

        if git ls-remote --exit-code --tags origin \
          "refs/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
          echo "release tag already exists: ${RELEASE_TAG}" >&2
          exit 1
        fi

        echo "upstream_tag=${upstream_tag}" >>"${GITHUB_OUTPUT}"

    - name: Install build dependencies
      shell: bash
      run: |
        set -euo pipefail
        export DEBIAN_FRONTEND=noninteractive
        sudo -E apt-get update
        sudo -E apt-get install -y bzip2 make

    - name: Build release tarball
      shell: bash
      run: |
        set -euo pipefail

        candidate_dir="${RUNNER_TEMP}/gvisor-candidate"
        mkdir -p "${candidate_dir}"
        make release-tarball DESTINATION="${candidate_dir}"
        test -f "${candidate_dir}/gvisor.tar.bz2"

        verify_dir="${RUNNER_TEMP}/gvisor-verify"
        mkdir -p "${verify_dir}"
        tar -xjf "${candidate_dir}/gvisor.tar.bz2" -C "${verify_dir}"
        "${verify_dir}/runsc" --version
        rm -rf "${verify_dir}"

    - name: Create candidate manifest
      shell: bash
      env:
        UPSTREAM_TAG: ${{ steps.candidate.outputs.upstream_tag }}
      run: |
        set -euo pipefail

        candidate_dir="${RUNNER_TEMP}/gvisor-candidate"
        cd "${candidate_dir}"
        sha512sum gvisor.tar.bz2 >gvisor.tar.bz2.sha512
        tarball_sha512="$(cut -d ' ' -f 1 gvisor.tar.bz2.sha512)"
        changes="$(git -C "${GITHUB_WORKSPACE}" log \
          --format='%H %s' "${UPSTREAM_TAG}..${GITHUB_SHA}")"

        contents="$(tar -tjf gvisor.tar.bz2 \
          | sed 's#^\./##' | grep -v '/$' | sort)"

        jq -n \
          --arg repository "${GITHUB_REPOSITORY}" \
          --arg commit "${GITHUB_SHA}" \
          --arg upstream_tag "${UPSTREAM_TAG}" \
          --arg release_tag "${RELEASE_TAG}" \
          --arg workflow_run_id "${GITHUB_RUN_ID}" \
          --arg tarball_sha512 "${tarball_sha512}" \
          --arg contents "${contents}" \
          --arg changes "${changes}" \
          '{
            schema: 2,
            repository: $repository,
            commit: $commit,
            upstream_tag: $upstream_tag,
            release_tag: $release_tag,
            workflow_run_id: $workflow_run_id,
            tarball_sha512: $tarball_sha512,
            contents: $contents,
            changes: $changes
          }' >manifest.json

    - name: Upload candidate
      id: upload
      uses: actions/upload-artifact@v4
      with:
        name: gvisor-candidate-${{ github.run_id }}
        path: |
          ${{ runner.temp }}/gvisor-candidate/gvisor.tar.bz2
          ${{ runner.temp }}/gvisor-candidate/gvisor.tar.bz2.sha512
          ${{ runner.temp }}/gvisor-candidate/manifest.json
        if-no-files-found: error
        compression-level: 0
        retention-days: 30

    - name: Summarize candidate
      shell: bash
      run: |
        {
          echo "### AKernel gVisor candidate"
          echo
          echo "- Run ID: \`${GITHUB_RUN_ID}\`"
          echo "- Planned release: \`${RELEASE_TAG}\`"
          echo "- Commit: \`${GITHUB_SHA}\`"
          echo "- Artifact digest: \`${{ steps.upload.outputs.artifact-digest }}\`"
          echo "- Artifact: ${{ steps.upload.outputs.artifact-url }}"
        } >>"${GITHUB_STEP_SUMMARY}"
